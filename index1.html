<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unknown Zone | Utility Tool</title>
    <script src="https://unpkg.com/@otplib/preset-browser@^12.0.0/buffer.js"></script>
    <script src="https://unpkg.com/@otplib/preset-browser@^12.0.0/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 50px; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 320px; text-align: center; border: 1px solid #334155; }
        h3 { margin-top: 0; color: #38bdf8; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; outline: none; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        button:hover { background: #0ea5e9; }
        .result-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px dashed #38bdf8; min-height: 24px; }
        .status { font-size: 12px; color: #4ade80; margin-top: 5px; opacity: 0; transition: 0.3s; }
        
        /* Telegram Button Style */
        .tg-link {
            margin-top: 40px;
            padding: 12px 25px;
            background: #24A1DE;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(36, 161, 222, 0.3);
        }
        .tg-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(36, 161, 222, 0.5);
        }
    </style>
</head>
<body>

    <h1 style="color: #38bdf8;">Unknown Zone Multi-Tool</h1>

    <div class="container">
        <div class="card">
            <h3>FB ID Extractor</h3>
            <button onclick="pasteLink()">Paste & Extract</button>
            <input type="text" id="fbInput" placeholder="Paste FB Link here..." oninput="handleID(this.value)">
            <div class="result-box" id="idResult">---</div>
            <div id="idStatus" class="status">ID Copied! ✅</div>
        </div>

        <div class="card">
            <h3>2FA Authenticator</h3>
            <button onclick="paste2FA()">Paste & Get Code</button>
            <input type="text" id="twoFAInput" placeholder="Paste 2FA Secret Key..." oninput="handle2FA(this.value)">
            <div class="result-box" id="twoFAResult" style="font-size: 24px; letter-spacing: 5px; color: #4ade80;">------</div>
            <div id="twoFAStatus" class="status">OTP Copied! ✅</div>
        </div>
    </div>

    <a href="https://t.me/UnknownZone0001" target="_blank" class="tg-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm4.462 15.598l-1.588 7.462c-.113.51-.413.638-.84.39l-2.422-1.785-1.169 1.124c-.126.127-.232.232-.474.232l.176-2.492 4.535-4.097c.197-.175-.041-.273-.305-.098l-5.603 3.525-2.414-.754c-.523-.164-.533-.523.11-.773l9.423-3.63c.437-.16.82.102.667.796z"/></svg>
        Join Unknown Zone Telegram
    </a>

    <script>
        // Copy Function
        function copyToClipboard(text, statusId) {
            if(!text || text === "---" || text.includes("Invalid")) return;
            navigator.clipboard.writeText(text).then(() => {
                const status = document.getElementById(statusId);
                status.style.opacity = "1";
                setTimeout(() => { status.style.opacity = "0"; }, 2000);
            });
        }

        // --- ID Extraction Logic ---
        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('fbInput').value = text;
                handleID(text);
            } catch (err) { alert("Permission denied!"); }
        }

        function handleID(text) {
            const match = text.match(/\d+/);
            const res = document.getElementById('idResult');
            if (match) {
                res.innerText = match[0];
                copyToClipboard(match[0], 'idStatus');
            } else {
                res.innerText = "No ID found";
            }
        }

        // --- 2FA Logic ---
        async function paste2FA() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('twoFAInput').value = text;
                handle2FA(text);
            } catch (err) { alert("Permission denied!"); }
        }

        function handle2FA(secret) {
            const res = document.getElementById('twoFAResult');
            const cleanSecret = secret.replace(/\s+/g, ''); // Space remove kora
            
            try {
                const token = otplib.authenticator.generate(cleanSecret);
                res.innerText = token;
                copyToClipboard(token, 'twoFAStatus');
            } catch (err) {
                res.innerText = "Invalid Key";
                res.style.fontSize = "16px";
            }
        }

        setInterval(() => {
            const currentSecret = document.getElementById('twoFAInput').value;
            if(currentSecret) handle2FA(currentSecret);
        }, 30000);
    </script>

</body>
</html>
